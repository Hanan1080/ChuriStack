<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Churi Stack – Traditional Bangles</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8f4;--ink:#1d2a26;--green:#0f3b33;--gold:#b98a2e;--red:#9b1c2e;--line:#e6d7b8;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fdf8f4;--ink:#1d2a26}}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Segoe UI',sans-serif;line-height:1.7}
.serif{font-family:'Cormorant Garamond','Hind Siliguri',Georgia,serif}
.arch{border-radius:999px 999px 14px 14px}
.gold-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.motif{background-image:radial-gradient(circle,rgba(185,138,46,.28) 1.5px,transparent 2px);background-size:22px 22px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
details[open] .pl{transform:rotate(45deg)}
.card img{transition:transform .5s}.card:hover img{transform:scale(1.04)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="sticky top-0 z-40 bg-[#0f3b33] text-[#f3e6c4]">
  <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between gap-4">
    <a href="#top" class="serif text-3xl font-bold text-[#e3bf6a] tracking-wide">Churi Stack</a>
    <nav class="hidden md:flex gap-7 text-[15px]">
      <a href="#shop" data-t="n1" class="hover:text-[#e3bf6a]"></a>
      <a href="#match" data-t="n2" class="hover:text-[#e3bf6a]"></a>
      <a href="#order" data-t="n3" class="hover:text-[#e3bf6a]"></a>
      <a href="#faq" data-t="n4" class="hover:text-[#e3bf6a]"></a>
    </nav>
    <div class="flex items-center gap-2">
      <button id="lang" class="px-4 py-1 rounded-full border border-[#e3bf6a] text-sm hover:bg-[#e3bf6a] hover:text-[#0f3b33]">বাংলা</button>
      <a href="tel:+8801700000000" data-t="call" class="px-4 py-1.5 rounded-full bg-[#e3bf6a] text-[#0f3b33] text-sm font-semibold"></a>
    </div>
  </div>
  <div class="gold-line"></div>
</header>

<section id="top" class="motif">
  <div class="max-w-6xl mx-auto px-5 py-14 md:py-20 grid md:grid-cols-12 gap-10 items-center">
    <div class="md:col-span-7">
      <h1 class="serif text-5xl md:text-7xl font-bold leading-[1.05] text-[#0f3b33]" data-t="h1"></h1>
      <p class="mt-6 text-lg max-w-xl text-[#3d4a45]" data-t="sub"></p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a href="#order" data-t="c1" class="px-8 py-3.5 rounded-full bg-[#9b1c2e] text-white font-semibold shadow-md hover:bg-[#7f1624]"></a>
        <a href="#shop" data-t="c2" class="px-8 py-3.5 rounded-full border border-[#0f3b33] text-[#0f3b33] font-semibold hover:bg-[#0f3b33] hover:text-white"></a>
      </div>
      <p class="mt-8 text-sm text-[#6b5b3a]" data-t="trust"></p>
    </div>
    <div class="md:col-span-5 flex justify-center">
      <div class="arch p-2 border border-[#b98a2e] w-72 md:w-80"><img id="heroImg" alt="" class="arch w-full aspect-[3/4] object-cover"></div>
    </div>
  </div>
</section>

<div class="gold-line"></div>

<section id="shop" class="max-w-6xl mx-auto px-5 py-16">
  <h2 class="serif text-4xl md:text-5xl font-bold text-[#0f3b33] text-center" data-t="shopH"></h2>
  <p class="text-center mt-2 mb-8 text-[#5b6660]" data-t="shopP"></p>
  <div id="filters" class="flex flex-wrap justify-center gap-2 mb-10"></div>
  <div id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-5 md:gap-7"></div>
</section>

<section id="match" class="bg-[#0f3b33] text-[#f3e6c4] py-16">
  <div class="max-w-6xl mx-auto px-5">
    <h2 class="serif text-4xl md:text-5xl font-bold text-[#e3bf6a] text-center" data-t="mH"></h2>
    <p class="text-center mt-2 mb-10 text-[#cdd9d3]" data-t="mP"></p>
    <div id="matches" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>
</section>

<section id="order" class="max-w-3xl mx-auto px-5 py-16">
  <div class="bg-white border border-[#e6d7b8] rounded-2xl p-6 md:p-10 shadow-sm">
    <h2 class="serif text-4xl font-bold text-[#0f3b33] text-center" data-t="oH"></h2>
    <p class="text-center mt-1 mb-7 text-[#5b6660]" data-t="oP"></p>
    <div class="grid gap-4">
      <input id="fn" data-ph="p1" class="border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white">
      <input id="fp" data-ph="p2" inputmode="tel" class="border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white">
      <div class="grid grid-cols-3 gap-4">
        <select id="fs" class="col-span-2 border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white"></select>
        <input id="fq" type="number" min="1" value="1" class="border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white">
      </div>
      <input id="fo" data-ph="p3" class="border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white">
      <textarea id="fa" rows="2" data-ph="p4" class="border border-[#d9c9a3] rounded-lg px-4 py-3 bg-white"></textarea>
      <button id="send" data-t="send" class="py-3.5 rounded-full bg-[#9b1c2e] hover:bg-[#7f1624] text-white font-semibold text-lg"></button>
    </div>
  </div>
</section>

<section id="faq" class="max-w-3xl mx-auto px-5 pb-16">
  <h2 class="serif text-4xl md:text-5xl font-bold text-[#0f3b33] text-center mb-8" data-t="fH"></h2>
  <div id="faqList" class="space-y-3"></div>
</section>

<section class="motif border-y border-[#e6d7b8] text-center py-16 px-5">
  <h2 class="serif text-4xl md:text-5xl font-bold text-[#0f3b33]" data-t="kH"></h2>
  <p class="mt-2 mb-7 text-[#5b6660]" data-t="kP"></p>
  <a href="tel:+8801700000000" class="inline-block px-9 py-4 rounded-full bg-[#0f3b33] text-[#f3e6c4] text-xl font-semibold shadow-lg hover:bg-[#0b2d27]">📞 <span data-t="kB"></span> +880 1700-000000</a>
</section>

<footer class="bg-[#0f3b33] text-[#cdd9d3] text-center py-7 text-sm">
  <div class="serif text-2xl text-[#e3bf6a]">Churi Stack</div>
  <div data-t="foot"></div>
</footer>

let L="en",cat="all";const $=q=>document.querySelector(q);

  $("#lang").textContent=L==="en"?"বাংলা":"English";
  $("#heroImg").src=IMG[6];
  $("#filters").innerHTML=["all","glass","silver","metal","oxi"].map(k=>`<button data-k="${k}" class="px-5 py-2 rounded-full text-[15px] border ${cat===k?"bg-[#0f3b33] text-[#f3e6c4] border-[#0f3b33]":"bg-white text-[#0f3b33] border-[#d9c9a3] hover:border-[#0f3b33]"}">${k==="all"?t.all:t.cats[k]}</button>`).join("");
  $("#filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.k;render()});
  $("#grid").innerHTML=P.filter(p=>cat==="all"||p.c===cat).map(p=>`<div class="card bg-white rounded-xl overflow-hidden border border-[#e6d7b8]">
    <div class="overflow-hidden aspect-[4/5]"><img src="${IMG[p.i]}" alt="${p[L]}" class="w-full h-full object-cover"></div>
    <div class="p-4"><div class="text-xs text-[#8a6a1f]">${t.cats[p.c]}</div>
    <h3 class="serif text-xl font-semibold leading-snug text-[#0f3b33]">${p[L]}</h3>
    <div class="flex items-center justify-between mt-3"><b class="text-[#9b1c2e]">৳${p.p}</b>
    <a href="#order" data-pick="${p.id}" class="px-4 py-1.5 rounded-full bg-[#0f3b33] text-[#f3e6c4] text-sm hover:bg-[#9b1c2e]">${t.buy}</a></div></div></div>`).join("");
  document.querySelectorAll("[data-pick]").forEach(a=>a.onclick=()=>{$("#fs").value=a.dataset.pick});
  const s=$("#fs"),cur=s.value;s.innerHTML=P.map(p=>`<option value="${p.id}">${p[L]} – ৳${p.p}</option>`).join("");if(cur)s.value=cur;
  const mi=[6,3,2,0];

}
